name: CI

on:
    pull_request:
        branches:
            - Master
    push:
        branches:
            - Master

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17.0-alpine
                env:
                    POSTGRES_USER: ormi_user
                    POSTGRES_PASSWORD: ormi_password
                    POSTGRES_DB: ormi_db
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ormi_user -d ormi_db"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: ci-test-secret-key-for-github-actions
            DATABASE_URL: postgresql://ormi_user:ormi_password@localhost:5432/ormi_db
            APP_URL: http://localhost:3000

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            # Pinned, not `latest`: bun 1.2.x resolves the React Compiler's babel
            # plugin relative to next's own bundle and breaks `bun run build`.
            # Keep in step with the Bun version in Dockerfile.ormi_core.
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Cache Bun install cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Create .env file for web app
              run: |
                  cat > apps/web/.env << EOF
                  NEXTAUTH_URL=http://localhost:3000
                  NEXTAUTH_SECRET=ci-test-secret-key-for-github-actions
                  DATABASE_URL=postgresql://ormi_user:ormi_password@localhost:5432/ormi_db
                  APP_URL=http://localhost:3000
                  EOF

            - name: Lint code
              run: bun run lint

            - name: Run type checks
              run: bun run typecheck

            - name: Build all packages
              run: bun run build

            - name: Run tests
              run: bun run test
