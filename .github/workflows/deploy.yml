name: Deploy

on:
    workflow_run:
        workflows: [CI]
        branches: [Master]
        types: [completed]
    # Manual runs publish to :ci-test instead of :latest, so the full two-platform
    # pipeline can be exercised from any branch without the field robots (which
    # poll :latest every 30s through watchtower) ever seeing the result.
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/rma-robotics-autonomous-systems/ormi

jobs:
    # Each platform builds natively on its own runner, in parallel. The previous
    # single-job build emulated linux/arm64 through QEMU on an x86 runner, which
    # was ~29 of the pipeline's ~34 minutes. Native arm64 runners are free for
    # public repositories.
    build:
        name: Build ${{ matrix.platform }}
        # A workflow_run trigger fires on CI *completion*, whatever the
        # conclusion — without this guard a red CI still publishes an image.
        # Manual dispatches have no upstream run to check.
        if: >-
            ${{ github.event_name == 'workflow_dispatch'
            || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  # workflow_run checks out the default branch tip by default,
                  # which can already be ahead of the commit CI validated. Pin
                  # to that commit so the image, and the version it stamps,
                  # are the code that passed.
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Compute build stamp
              run: |
                  sha=$(git rev-parse --short=7 HEAD)
                  day=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
                  echo "APP_VERSION=${day}-${sha}" >> "$GITHUB_ENV"

            - name: Set platform slug
              run: echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"
              env:
                  platform: ${{ matrix.platform }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Pushed by digest only; the `merge` job assembles the manifest list
            # so `:latest` flips to the multi-arch image in one atomic step and
            # watchtower never sees a half-published tag.
            #
            # Cache lives in the registry rather than type=gha: the dependency
            # layer alone is ~2.3 GB, which would thrash the 10 GB Actions cache.
            # Because the Dockerfile installs from manifests before copying
            # sources, a commit that does not touch package.json/bun.lock reuses
            # that layer outright.
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.ormi_core
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ env.APP_VERSION }}
                  cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_SLUG }}
                  cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ env.PLATFORM_SLUG }},mode=max
                  outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${digest#sha256:}"
              env:
                  digest: ${{ steps.build.outputs.digest }}

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ env.PLATFORM_SLUG }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Publish manifest
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            packages: write

        steps:
            - name: Resolve publish tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      echo "PUBLISH_TAG=ci-test" >> "$GITHUB_ENV"
                  else
                      echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
                  fi

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digest-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create and push manifest list
              working-directory: /tmp/digests
              run: |
                  # Word splitting is intended: one @sha256:... argument per
                  # platform digest file.
                  # shellcheck disable=SC2046
                  docker buildx imagetools create \
                      --tag "${IMAGE_NAME}:${PUBLISH_TAG}" \
                      $(printf "${IMAGE_NAME}@sha256:%s " *)

            - name: Inspect published image
              run: docker buildx imagetools inspect "${IMAGE_NAME}:${PUBLISH_TAG}"
