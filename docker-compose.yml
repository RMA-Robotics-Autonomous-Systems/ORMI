services:
  core:
    container_name: ormi_core
    network_mode: host
    build:
      context: .
      dockerfile: Dockerfile.ormi_core
    restart: always
    volumes:
      - ./ormi-core:/ormi-core
      - ./ormi-core/node_modules:/ormi-core/node_modules
      - ./ormi-core/.next:/app/.next

  rosbridge_suite:
    container_name: ormi_rosbridge_suite
    build:
      context: . # Build context (optional, defaults to current directory)
      dockerfile: Dockerfile.rosbridge_suite
    restart: unless-stopped
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml namespace:=${USER} respawn:=true
    # environment:
    # - "ROBOTNAME=${ROBOTNAME}"
