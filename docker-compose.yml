services:
    core:
        container_name: ormi_core
        network_mode: host
        build:
            context: .
            dockerfile: Dockerfile.ormi_core
            args:
                # Override to bake a different public URL into the client bundle
                NEXT_PUBLIC_APP_URL: http://localhost:3000
        restart: unless-stopped
        environment:
            DATABASE_URL: postgresql://rasappdbuser:rasappdbpwd@localhost:5432/rasapppostgresqldb
            NEXTAUTH_URL: http://localhost:3000
            NEXTAUTH_SECRET: change-me-in-production
            NEXT_PUBLIC_APP_URL: http://localhost:3000
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:17.0-alpine
        restart: unless-stopped
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: rasappdbuser
            POSTGRES_PASSWORD: rasappdbpwd
            POSTGRES_DB: rasapppostgresqldb
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - ./postgres:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U rasappdbuser -d rasapppostgresqldb" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
